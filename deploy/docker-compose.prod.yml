# Production docker-compose for NexusERP on a single VM.
# Tuned for 1GB RAM (e2-micro Always-Free). MinIO and MeiliSearch are
# omitted because they aren't yet wired into any UI flow and don't
# fit on a 1GB host.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexuserp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuned for 1GB host: small shared_buffers, modest work_mem.
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=40
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexuserp"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    # AOF persistence (everysec) so queued jobs survive restarts; tiny disk cost.
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 80M

  api:
    image: ${API_IMAGE}
    container_name: nexus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: nexuserp
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexuserp
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${PUBLIC_URL}
      # Used by UserService.buildActivationUrl() to build set-password links
      # an admin shares with newly-created or password-resetting users.
      PUBLIC_URL: ${PUBLIC_URL}
      # GCS file storage (VM service account provides credentials via ADC)
      GCS_PUBLIC_BUCKET: nexus-erp-public-responsive-sun-462613-d0
      GCS_PRIVATE_BUCKET: nexus-erp-files-responsive-sun-462613-d0
    deploy:
      resources:
        limits:
          memory: 280M

  web:
    image: ${WEB_IMAGE}
    container_name: nexus-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL}/api/v1
    healthcheck:
      # 127.0.0.1 (not localhost): busybox wget resolves localhost to ::1 but
      # the Next server listens on IPv4 only.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 220M

  caddy:
    image: caddy:2-alpine
    container_name: nexus-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
